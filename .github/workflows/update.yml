name: 更新 Steam 价格

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时一次（UTC），打折季能及时看到变化
  workflow_dispatch: {}       # 也可以在 Actions 页面手动点 "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: 提交新价格
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "更新价格 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
